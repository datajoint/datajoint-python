name: Lint
permissions:
  contents: read
on:
  push:
    branches:
      - "**" # every branch
      - "!gh-pages" # exclude gh-pages branch
      - "!stage*" # exclude branches beginning with stage
  pull_request:
    branches:
      - "**" # every branch
      - "!gh-pages" # exclude gh-pages branch
      - "!stage*" # exclude branches beginning with stage
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
    # enforce the same check as pre-commit
    # but only run important checks.
    # These steps are what pre-commit/action does, written out so that every
    # action is pinned by SHA (pre-commit/action calls actions/cache by tag).
    - run: python -m pip install pre-commit==4.7.0
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}
    - run: pre-commit run --show-diff-on-failure --color=always codespell --all-files
    - run: pre-commit run --show-diff-on-failure --color=always ruff --all-files
    - run: pre-commit run --show-diff-on-failure --color=always ruff-format --all-files
