name: Test

on:
  push:
    branches:
      - "**"
      - "!gh-pages"
      - "!stage*"
    paths:
      - "src/datajoint/**"
      - "tests/**"
      - "pyproject.toml"
      - "pixi.lock"
      - ".github/scripts/minimum_requirements.py"
      - ".github/workflows/test.yaml"
  pull_request:
    branches:
      - "**"
      - "!gh-pages"
      - "!stage*"
    paths:
      - "src/datajoint/**"
      - "tests/**"
      - "pyproject.toml"
      - "pixi.lock"
      - ".github/scripts/minimum_requirements.py"
      - ".github/workflows/test.yaml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Python: exercise both ends of the supported range (requires-python
        # >=3.10,<3.16) and the previous newest release; version-pinned pixi
        # environments live in pyproject.toml under [tool.pixi.environments].
        environment: [test-py310, test-py314, test-py315]
        # MySQL: exercise both LTS lines we support / that AWS RDS runs. 8.0 uses
        # the datajoint image (SSL configured); 8.4 uses the official image (TLS
        # tests already skip outside external containers). See #1497.
        mysql-image: ["datajoint/mysql:8.0", "mysql:8.4"]
    name: test (${{ matrix.environment }}, mysql=${{ matrix.mysql-image }})
    steps:
      - uses: actions/checkout@v7

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          cache: true
          locked: false
          environments: ${{ matrix.environment }}

      - name: Run tests
        env:
          DJ_TEST_MYSQL_IMAGE: ${{ matrix.mysql-image }}
        run: pixi run -e ${{ matrix.environment }} test-cov

  # Unit tests run without containers (faster feedback)
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          cache: true
          locked: false

      - name: Run unit tests
        run: pixi run -e test pytest tests/unit -v

  # Windows unit tests: guard OS-specific behavior (path separators, etc.) that
  # the Linux jobs above cannot catch — e.g. #1520, where file-protocol paths
  # rendered with native backslashes broke garbage collection on Windows.
  # pixi targets linux/osx only (see [tool.pixi] platforms), so this leg uses
  # pip. Unit tests need no containers, so no Docker/DB is required on Windows.
  unit-tests-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Exercise both ends of the supported range (requires-python >=3.10,<3.16)
        # and the previous newest release.
        python-version: ["3.10", "3.14", "3.15"]
    name: unit-tests-windows (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hatch-vcs derives the version from git history/tags

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # NOTE: pip resolves `[project.optional-dependencies].test`, which is a
      # DIFFERENT set than the pixi Linux legs' `[dependency-groups].test`
      # (e.g. it omits graphviz). A unit test importing a dep present in only
      # one set would then pass on Linux but error on Windows (or vice versa) —
      # a dep-set mismatch that reads like an OS bug. Keep the two `test` sets
      # in sync when unit-test dependencies change.
      - name: Install package with test extras
        run: pip install -e ".[test]"

      - name: Run unit tests
        run: pytest tests/unit -v

  # Minimum versions: run the full suite on the oldest supported Python with
  # every runtime dependency ([project].dependencies; extras are not pinned) at
  # the minimum pyproject.toml declares, so those minimums stay true.
  # minimum_requirements.py also fails the job when a runtime dependency
  # declares no minimum. Uses pip, not pixi, because pixi resolves the newest
  # versions from the lock file.
  test-min-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: test (minimum dependency versions, py3.10)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs derives the version from git history/tags
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"

      - name: Install graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Pin runtime dependencies at their minimums
        run: |
          python -m pip install tomli==2.5.0 packaging==26.3
          python .github/scripts/minimum_requirements.py --python 3.10 > "$RUNNER_TEMP/minimum.txt"
          cat "$RUNNER_TEMP/minimum.txt"

      - name: Install package with test extras
        run: python -m pip install -e ".[test]" -c "$RUNNER_TEMP/minimum.txt"

      - name: Run tests
        run: python -m pytest tests/
